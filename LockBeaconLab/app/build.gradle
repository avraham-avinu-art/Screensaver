plugins {
    id 'com.android.application'
}

android {
    namespace 'io.clockbeacon.minilock'
    compileSdk 36

    defaultConfig {
        applicationId 'io.clockbeacon.minilock'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }
}
