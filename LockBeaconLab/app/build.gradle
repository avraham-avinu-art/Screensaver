plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.foregroundserviceexample'
    compileSdk 36

    defaultConfig {
        applicationId 'io.clockbeacon.minilock'
        minSdk 26
        targetSdk 30
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
