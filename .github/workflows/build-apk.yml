name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 9.5
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Prepare font editing tools
        run: |
          python3 -m venv /tmp/font-normalizer-env
          /tmp/font-normalizer-env/bin/python -m pip install --disable-pip-version-check fonttools==4.63.0

      - name: Normalize custom font files
        run: |
          /tmp/font-normalizer-env/bin/python tools/normalize_font_sizes.py \
            --assets-dir app/src/main/assets/fonts \
            --zip-output app/build/normalized-fonts.zip

      - name: Save normalized font files to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/assets/fonts
          if git diff --cached --quiet; then
            echo "Font files are already normalized."
          else
            git commit -m "Normalize visual sizes of custom font glyphs"
            git push origin HEAD:main
          fi

      - name: Configure persistent release signing
        env:
          NIGHTSCREEN_SIGNING_BUNDLE_BASE64: ${{ secrets.NIGHTSCREEN_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [ -z "$NIGHTSCREEN_SIGNING_BUNDLE_BASE64" ]; then
            echo "No persistent signing key secret is configured."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os
          raw = base64.b64decode(os.environ["NIGHTSCREEN_SIGNING_BUNDLE_BASE64"], validate=True)
          bundle = json.loads(raw.decode("utf-8"))
          keystore_path = os.path.join(os.environ["RUNNER_TEMP"], "nightscreen-release.jks")
          with open(keystore_path, "wb") as keystore:
              keystore.write(base64.b64decode(bundle["keystore_base64"], validate=True))
          os.chmod(keystore_path, 0o600)
          env_path = os.environ["GITHUB_ENV"]
          values = {
              "NIGHTSCREEN_RELEASE_KEYSTORE_PATH": keystore_path,
              "NIGHTSCREEN_RELEASE_STORE_PASSWORD": bundle["store_password"],
              "NIGHTSCREEN_RELEASE_KEY_ALIAS": bundle["key_alias"],
              "NIGHTSCREEN_RELEASE_KEY_PASSWORD": bundle["key_password"],
          }
          with open(env_path, "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  if "\\n" in value or "\\r" in value:
                      raise ValueError("Signing values must not contain line breaks")
                  env_file.write(f"{key}={value}\\n")
          print("Persistent release signing key configured.")
          PY

      - name: Report release signing mode
        run: |
          if [ -n "${NIGHTSCREEN_RELEASE_KEYSTORE_PATH:-}" ]; then
            echo "Using the configured persistent release signing key."
          else
            echo "::warning::Stable signing is not configured. This APK uses the temporary debug key and will not be upgrade-compatible across independent GitHub runners."
          fi

      - name: Build release APK
        env:
          NIGHTSCREEN_RELEASE_STORE_PASSWORD: ${{ secrets.NIGHTSCREEN_RELEASE_STORE_PASSWORD }}
          NIGHTSCREEN_RELEASE_KEY_ALIAS: ${{ secrets.NIGHTSCREEN_RELEASE_KEY_ALIAS }}
          NIGHTSCREEN_RELEASE_KEY_PASSWORD: ${{ secrets.NIGHTSCREEN_RELEASE_KEY_PASSWORD }}
        run: gradle --version && gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightScreen-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload normalized font files
        uses: actions/upload-artifact@v4
        with:
          name: NightScreen-normalized-fonts
          path: app/build/normalized-fonts.zip
          if-no-files-found: error
          retention-days: 30
