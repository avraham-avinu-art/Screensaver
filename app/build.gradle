plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("NIGHTSCREEN_RELEASE_KEYSTORE_PATH")
def hasPersistentReleaseSigning = releaseKeystorePath != null
        && !releaseKeystorePath.trim().isEmpty()

android {
    namespace 'com.avrahamart.nightscreen'
    compileSdk 36

    defaultConfig {
        applicationId 'com.screensaver'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '2.0.0'
    }

    flavorDimensions += "usageDetection"
    productFlavors {
        usageAccess {
            dimension "usageDetection"
            buildConfigField "boolean", "USAGE_ACCESS_ENABLED", "true"
        }
        noUsageAccess {
            dimension "usageDetection"
            buildConfigField "boolean", "USAGE_ACCESS_ENABLED", "false"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasPersistentReleaseSigning) {
            stableRelease {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("NIGHTSCREEN_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("NIGHTSCREEN_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("NIGHTSCREEN_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasPersistentReleaseSigning
                    ? signingConfigs.stableRelease : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.kosherjava:zmanim:2.5.0'
    testImplementation 'junit:junit:4.13.2'
}
